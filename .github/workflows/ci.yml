# .github/workflows/ci.yml
#
# Builds Shopizer and runs its tests on every PR into 3.2.7 and on every
# push to 3.2.7. The job name "build" is what you select as a required
# status check in the ruleset.

name: CI

on:
  push:
    branches: [3.2.7]
  pull_request:
    branches: [3.2.7]

# Least privilege: the build only needs to read the code.
permissions:
  contents: read

# If the agent pushes again to the same PR, cancel the older, now-outdated run
# instead of letting two 20-minute builds compete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # safety net in case a test hangs

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Java 17, as in your local baseline. "cache: maven" stores ~/.m2
      # between runs, keyed on the pom files, so only the first run pays
      # the full download cost.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The same command as in CLAUDE.md, so CI and the agent build the
      # same way. chmod is needed because the wrapper script may not be
      # marked executable in git. (-ntp is not used: the pinned Maven
      # 3.5.2 does not support it.)
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B clean install

      # When tests fail, keep the detailed reports so you (or the agent,
      # which has Actions: read) can see exactly which test broke and why.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 14
